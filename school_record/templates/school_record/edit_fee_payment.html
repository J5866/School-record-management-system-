{% extends 'school_record/base.html'%}
{% block content %}
    <h1>Edit Fee Payment Record</h1>
    <form method="POST">
        {% csrf_token %}
        <label> Student:</label>
        <select name="student" required>
            {% for item in students %}
            <option value="">---Select Student---</option>
            {% for item in students %}
                <option value="{{ item.id }}"
                 {% if payment.student.id==item.id %}selected{% endif %}>
                    {{ item.student_id }} - {{ item.first_name }} {{ item.last_name }}
                </option>
            {% endfor %}
        </select>
        <br><br>
        <label> Amount Paid:</label>
        <input type="number" name="amount_paid" value="{{ payment.amount_paid }}" 
                                            min="0" step="0.01" required>
        <br><br>
        <label> Payment Date:</label>
        <input type="date" name="payment_date" value="{{ payment.payment_date|date:'Y-m-d' }}" required>
        <br><br>
        <label> Term:</label>
        <select name="term" required>
            {% for Value, Label in terms_choice %}
                <option value="{{ Value }}" {% if payment.term==Value %}selected{% endif %}>
                    {{ Label }}
                </option>
            {% endfor %}
            </select>
            <br><br>
            <label>Descrition:</label>
            <textarea
            name="descrition">{{ payment.description }}</textarea>
            <br><br>
            <button type="submit">Update Payment</button>
    </form>
    <br>
    <a href="{% url 'fee_payment_list' %}">Back to Fee Payment</a>
{% endblock %}
