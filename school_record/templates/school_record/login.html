{% extends 'school_record/base.html'%}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="login-page">
        <h1>School Record Management System</h1>
        <h2>Login</h2>
        <p>Please login to access the system</p>

            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
    </div>
    {% endblock %}
